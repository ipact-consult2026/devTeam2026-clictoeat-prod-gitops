apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordear-super-deployment
  namespace: ordear
  labels:
    app: ordear-super-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ordear-super-app
  template:
    metadata:
      labels:
        app: ordear-super-app
    spec:
      containers:
        - name: ordear-super
          image: ipactconsult2026dockerhubadmin/clictoeat-super:v1.1.8-prod
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "64Mi"
