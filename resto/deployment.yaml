apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordear-resto-deployment
  namespace: ordear
  labels:
    app: ordearfrontresto-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ordearfrontresto-app
  template:
    metadata:
      labels:
        app: ordearfrontresto-app
    spec:
      containers:
        - name: ordearfrontresto
          image: ipactconsult2026dockerhubadmin/clictoeatfrontresto:v2.0.9-prod
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "128Mi"
